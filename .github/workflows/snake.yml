name: Generate Snake Animation

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out generated assets branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: output
          path: snake-output
      - name: Generate contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            snake-output/github-contribution-grid-snake.svg?color_snake=#285cdd
            snake-output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7ca6ff
      - name: Publish generated assets
        working-directory: snake-output
        shell: bash
        run: |
          set -euo pipefail
          test -s github-contribution-grid-snake.svg
          test -s github-contribution-grid-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution SVGs are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh contribution animation"
          for attempt in 1 2 3; do
            if git push origin HEAD:output; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Unable to publish contribution SVGs after three attempts."
          exit 1
